name: Firebase Rules Emulator Isolation
on:
  push:
    branches: [reconciliation/studio-2026-11-27]
  pull_request:
    branches: [main, master]
permissions:
  contents: read
jobs:
  firestore_rules:
    name: Isolated Firestore rules authorization
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run rule tests against local demo emulator only
        shell: bash
        env:
          CI: 'true'
          GCLOUD_PROJECT: demo-signal-forge-rules
          FIRESTORE_EMULATOR_HOST: '127.0.0.1:8080'
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cp firestore.rules scripts/firestore-emulator-isolation.mjs "$tmp/"
          cd "$tmp"
          printf '%s\n' '{"private":true,"type":"module"}' > package.json
          printf '%s\n' '{"firestore":{"rules":"firestore.rules"},"emulators":{"firestore":{"host":"127.0.0.1","port":8080},"ui":{"enabled":false},"singleProjectMode":true}}' > firebase.json
          npm install --no-audit --no-fund --save-exact firebase@12.16.0 @firebase/rules-unit-testing@5.0.0 firebase-tools@15.32.1
          ./node_modules/.bin/firebase emulators:exec --only firestore --project demo-signal-forge-rules --config firebase.json 'node firestore-emulator-isolation.mjs'

name: Redacted Security History Audit
on:
  push:
    branches: [reconciliation/studio-2026-11-27]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    name: Heuristic history scan (not release clearance)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Redacted aggregate scan
        run: python3 scripts/redacted_security_history_audit.py

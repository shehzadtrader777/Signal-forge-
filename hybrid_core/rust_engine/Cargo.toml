[package]
name = "signal_forge_rust_engine"
version = "1.0.0"
edition = "2021"
description = "Signal Forge Phase 1-4 ultra-low-latency Rust execution core, mmap tick scanner, simulated L2 order book, and Python IPC bridge (inspired by nautilus_trader & vectorbt)."
authors = ["Amir Shahzad", "Co-developed with Gemini"]

[dependencies]
bincode = "1.3"
crossbeam-channel = "0.5"
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
